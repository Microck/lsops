name: release 0.3.0
on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/package-release.sh'
      - 'scripts/build-release.sh'
      - 'main.go'
      - 'RELEASE_NOTES.md'
  push:
    branches: [main]
    paths: ['RELEASE_NOTES.md']
permissions:
  contents: read
concurrency:
  group: release-0.3.0-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Formatting
        shell: bash
        run: test -z "$(gofmt -l .)"
      - run: go test -count=1 ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -trimpath -buildvcs=false -o lsops-test${{ runner.os == 'Windows' && '.exe' || '' }} .
      - name: Version smoke
        shell: bash
        run: ./lsops-test${{ runner.os == 'Windows' && '.exe' || '' }} --version

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build and smoke-test bundle
        run: sh scripts/package-release.sh 0.3.0 "$RUNNER_TEMP/release"

  publish:
    needs: [test, package]
    if: >-
      github.event_name == 'push' && github.repository == 'Microck/lsops' && startsWith(github.event.head_commit.message, 'chore(release): prepare v0.3.0')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build and smoke-test bundle
        run: sh scripts/package-release.sh 0.3.0 "$RUNNER_TEMP/release"
      - name: Publish once and verify downloaded bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Never overwrite an existing release/tag or upload without validation.
          if gh release view v0.3.0 >/dev/null 2>&1; then
            echo "v0.3.0 already exists; refusing to overwrite"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin refs/tags/v0.3.0 >/dev/null 2>&1; then
            echo "v0.3.0 tag already exists; refusing to move it"
            exit 1
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/tags/v0.3.0 -f sha="$GITHUB_SHA"
          gh release create v0.3.0 "$RUNNER_TEMP/release/lsops-0.3.0.zip" "$RUNNER_TEMP/release/SHA256SUMS.txt" --verify-tag --target "$GITHUB_SHA" --title "lsops 0.3.0" --notes-file RELEASE_NOTES.md --latest
          mkdir "$RUNNER_TEMP/downloaded"
          gh release download v0.3.0 --dir "$RUNNER_TEMP/downloaded"
          cd "$RUNNER_TEMP/downloaded"
          sha256sum --check SHA256SUMS.txt
          cmp lsops-0.3.0.zip "$RUNNER_TEMP/release/lsops-0.3.0.zip"
          unzip -q lsops-0.3.0.zip
          cd lsops
          sha256sum --check SHA256SUMS
          sh install.sh --dir "$RUNNER_TEMP/fresh-install"
          test "$("$RUNNER_TEMP/fresh-install/lsops" --version)" = "lsops 0.3.0"

name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Formatting
        shell: bash
        run: test -z "$(gofmt -l .)"
      - run: go test -count=1 ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -trimpath -buildvcs=false -o lsops-test${{ runner.os == 'Windows' && '.exe' || '' }} .
      - name: Version smoke
        shell: bash
        run: ./lsops-test${{ runner.os == 'Windows' && '.exe' || '' }} --version
